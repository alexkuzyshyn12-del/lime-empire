<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lime Empire</title>
<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
}
#lemon{
    font-size:120px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>🍋 Lime Empire</h1>

<h2 id="coins">0</h2>

<div id="lemon">🍋</div>

<script>
let coins = 0;

document.getElementById("lemon").onclick = function(){
    coins++;
    document.getElementById("coins").innerText = coins;
}
</script>

</body>
</html>
