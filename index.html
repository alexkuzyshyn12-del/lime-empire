<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #fff7cc, #ffe680);
    text-align: center;
}

h1 { margin-top: 10px; }

#balance {
    font-size: 40px;
    font-weight: bold;
}

#level {
    font-size: 18px;
    margin-bottom: 10px;
}

.center {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

#lime {
    width: 180px;
    cursor: pointer;
    transition: 0.1s;
}

#lime:active {
    transform: scale(0.9);
}

.shop {
    margin-top: 20px;
}

.card {
    background: white;
    width: 280px;
    margin: 10px auto;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #ffcc00;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🍋 Lime Empire</h1>

<div id="balance">0</div>
<div id="level">Level: 1</div>

<div class="center">
    <img id="lime"
    src="https://i.imgur.com/8Qf6Y6U.png"
    onclick="clickLime()">
</div>

<div class="shop">

    <div class="card">
        <h3>⚡ Power</h3>
        <button onclick="buyPower()">Buy (10)</button>
    </div>

    <div class="card">
        <h3>🏭 Factory 1</h3>
        <button onclick="buyFactory('lemon')">Buy (20)</button>
    </div>

    <div class="card">
        <h3>🏭 Factory 2</h3>
        <button onclick="buyFactory('juice')">Buy (100)</button>
    </div>

    <div class="card">
        <h3>🏭 Factory 3</h3>
        <button onclick="buyFactory('mega')">Buy (400)</button>
    </div>

</div>

<script>

// ===== DATA =====
let coins = Number(localStorage.getItem("coins")) || 0;
let power = Number(localStorage.getItem("power")) || 1;

let factories = {
    lemon: Number(localStorage.getItem("lemon")) || 0,
    juice: Number(localStorage.getItem("juice")) || 0,
    mega: Number(localStorage.getItem("mega")) || 0
};

let level = Number(localStorage.getItem("level")) || 1;

// ===== SAVE =====
function save() {
    localStorage.setItem("coins", coins);
    localStorage.setItem("power", power);
    localStorage.setItem("lemon", factories.lemon);
    localStorage.setItem("juice", factories.juice);
    localStorage.setItem("mega", factories.mega);
    localStorage.setItem("level", level);
}

// ===== UPDATE =====
function update() {
    document.getElementById("balance").innerText = coins;
    document.getElementById("level").innerText = "Level: " + level;
}

// ===== CLICK =====
function clickLime() {
    coins += power;
    save();
    update();
    checkLevel();
}

// ===== POWER =====
function buyPower() {
    if (coins >= 10) {
        coins -= 10;
        power += 1;
        save();
        update();
    }
}

// ===== FACTORIES =====
function buyFactory(type) {
    if (type === 'lemon' && coins >= 20) {
        coins -= 20;
        factories.lemon++;
    }
    if (type === 'juice' && coins >= 100) {
        coins -= 100;
        factories.juice++;
    }
    if (type === 'mega' && coins >= 400) {
        coins -= 400;
        factories.mega++;
    }
    save();
    update();
}

// ===== INCOME =====
setInterval(() => {
    coins += factories.lemon * 1;
    coins += factories.juice * 5;
    coins += factories.mega * 20;

    save();
    update();
    checkLevel();
}, 1000);

// ===== LEVEL =====
function checkLevel() {
    level = Math.floor(Math.pow(coins / 100, 0.6)) + 1;
}

// ===== START =====
update();

</script>

</body>
</html>
