<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lime Empire</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f6e27a;
  text-align:center;
  padding-bottom:90px;
}

.top{
  background:white;
  margin:10px;
  padding:10px;
  border-radius:15px;
}

#tapBtn{
  width:280px;
  height:280px;
  border-radius:50%;
  border:none;
  font-size:120px;
  background:#ffd54f;
  box-shadow:0 0 25px rgba(0,0,0,0.2);
  margin-top:20px;
}

.page{display:none;}
.active{display:block;}

.card{
  background:white;
  margin:10px;
  padding:12px;
  border-radius:12px;
}

.bottomMenu{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:white;
}

.bottomMenu button{
  flex:1;
  padding:15px;
  border:none;
  font-size:16px;
}
</style>
</head>

<body>

<div class="top">
<h1>🍋 Lime Empire</h1>

<h2>💰 <span id="coins">0</span></h2>
<p>⚡ Energy: <span id="energy">100</span></p>
<p>🖱 Power: <span id="power">1</span></p>
<p>💸 Income/hour: <span id="income">0</span></p>
</div>

<!-- HOME -->
<div id="home" class="page active">
<button id="tapBtn" onclick="tap()">🍋</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">

<div class="card">
<h3>Upgrade Tap</h3>
<button onclick="upgradeTap()">Upgrade</button>
</div>

<div class="card">
<h3>Rubber Factory</h3>
Level: <span id="rubberLvl">1</span>
<button onclick="buyFactory('rubber')">Upgrade</button>
</div>

<div class="card">
<h3>Juice Factory</h3>
Level: <span id="juiceLvl">1</span>
<button onclick="buyFactory('juice')">Upgrade</button>
</div>

<div class="card">
<h3>Lime Farm</h3>
Level: <span id="limeLvl">1</span>
<button onclick="buyFactory('lime')">Upgrade</button>
</div>

<div class="card">
<h3>Water Plant</h3>
Level: <span id="waterLvl">1</span>
<button onclick="buyFactory('water')">Upgrade</button>
</div>

<div class="card">
<h3>Energy Lab</h3>
Level: <span id="energyLvl">1</span>
<button onclick="buyFactory('energy')">Upgrade</button>
</div>

</div>

<!-- FRIENDS -->
<div id="friends" class="page">
<div class="card">
<h3>👥 Referral</h3>
<p id="refLink"></p>
</div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="page">
<div class="card">
<h3>🏆 Top Players</h3>
<div id="board">Loading...</div>
</div>
</div>

<!-- MENU -->
<div class="bottomMenu">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('shop')">🏭</button>
<button onclick="showPage('friends')">👥</button>
<button onclick="showPage('leaderboard')">🏆</button>
</div>

<script>
    
// ================= FIREBASE =================

const firebaseConfig = {
  apiKey: "AIzaSyDHs8hHW4y-QCGx1ncYy-SOwPTfmuHtjB8",
  authDomain: "limeempire-ca8d4.firebaseapp.com",
  projectId: "limeempire-ca8d4",
  storageBucket: "limeempire-ca8d4.firebasestorage.app",
  messagingSenderId: "86132052870",
  appId: "1:86132052870:web:e94cee824f08a191c81207",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ================= USER =================

let user = localStorage.getItem("uid");

if(!user){
  user = "U"+Math.floor(Math.random()*999999);
  localStorage.setItem("uid", user);
}

// ================= GAME DATA =================

let coins = 0;
let energy = 100;
let power = 1;

let factories = {
  rubber:1,
  juice:1,
  lime:1,
  water:1,
  energy:1
};

// ================= NAV =================

function showPage(page){
  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });
  document.getElementById(page).classList.add("active");
}

// ================= TAP =================

function tap(){
  if(energy <= 0) return;

  coins += power;
  energy--;

  update();
  save();
}

// ================= UPGRADE TAP =================

function upgradeTap(){
  let cost = power * 50;

  if(coins >= cost){
    coins -= cost;
    power++;
    update();
    save();
  }
}

// ================= BUY FACTORY =================

function buyFactory(type){

  let cost = factories[type] * 10000;

  if(coins >= cost){
    coins -= cost;
    factories[type]++;
    update();
    save();
  }
}

// ================= PASSIVE INCOME =================

setInterval(()=>{

  let income =
    factories.rubber*2 +
    factories.juice*5 +
    factories.lime*10 +
    factories.water*20 +
    factories.energy*40;

  coins += income;

  update();
  save();

},1000);

// ================= ENERGY REGEN =================

setInterval(()=>{

  if(energy < 100){
    energy++;
    update();
  }

},3000);

// ================= UPDATE UI =================

function update(){

  document.getElementById("coins").innerText = Math.floor(coins);
  document.getElementById("energy").innerText = energy;
  document.getElementById("power").innerText = power;

  let income =
    factories.rubber*2 +
    factories.juice*5 +
    factories.lime*10 +
    factories.water*20 +
    factories.energy*40;

  document.getElementById("income").innerText = income * 3600;

  document.getElementById("rubberLvl").innerText = factories.rubber;
  document.getElementById("juiceLvl").innerText = factories.juice;
  document.getElementById("limeLvl").innerText = factories.lime;
  document.getElementById("waterLvl").innerText = factories.water;
  document.getElementById("energyLvl").innerText = factories.energy;

  document.getElementById("refLink").innerText =
    window.location.origin + "?ref=" + user;
}

// ================= SAVE =================

function save(){
  db.collection("players").doc(user).set({
    coins,
    energy,
    power,
    factories
  }).catch(e=>{
    console.log("SAVE ERROR:", e);
  });
}

// ================= LOAD =================

async function load(){

  let doc = await db.collection("players").doc(user).get();

  if(doc.exists){
    let d = doc.data();

    coins = d.coins || 0;
    energy = d.energy || 100;
    power = d.power || 1;

    if(d.factories){
      factories = d.factories;
    }
  }

  update();
}

// ================= LEADERBOARD =================

async function leaderboard(){

  let snap = await db.collection("players")
    .orderBy("coins","desc")
    .limit(10)
    .get();

  let html = "";
  let i = 1;

  snap.forEach(doc=>{
    html += `
      <div>
        ${i}. ${doc.id} — 💰 ${Math.floor(doc.data().coins || 0)}
      </div>
    `;
    i++;
  });

  document.getElementById("board").innerHTML = html;
}

// ================= AUTO UPDATE =================

setInterval(()=>{
  leaderboard();
},5000);

// ================= ENERGY LOCK =================

setInterval(()=>{
  if(energy < 100){
    energy++;
    update();
  }
},3000);

// ================= START GAME =================

load();
leaderboard();
update();

</script>

</body>
</html>
