<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire PRO MAX</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #fff7cc, #ffe680);
    text-align: center;
}

h1 { margin: 10px; }

#balance {
    font-size: 40px;
    font-weight: bold;
}

#level {
    font-size: 16px;
}

/* LIME */
#lime {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    border: 6px solid #ffcc00;
    object-fit: cover;
    cursor: pointer;
    transition: 0.1s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

#lime:active {
    transform: scale(0.92);
}

/* PAGES */
.page { display:none; padding:10px; }
.active { display:block; }

/* CARD */
.card {
    background: white;
    width: 280px;
    margin: 10px auto;
    padding: 15px;
    border-radius: 12px;
}

/* NAV */
.nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: white;
    border-top: 1px solid #ddd;
}

.nav button {
    flex: 1;
    padding: 12px;
    border: none;
    background: white;
    font-weight: bold;
}
button.action {
    width: 100%;
    padding: 10px;
    background: #ffcc00;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🍋 Lime Empire PRO MAX</h1>

<div id="balance">0</div>
<div id="level">Level: 1</div>

<!-- HOME -->
<div id="home" class="page active">
    <img id="lime"
    src="https://upload.wikimedia.org/wikipedia/commons/1/1f/Lime-Whole-Split.jpg"
    onclick="clickLime()">
</div>

<!-- SHOP -->
<div id="shop" class="page">

<div class="card">
<h3>⚡ Power</h3>
<button class="action" onclick="buyPower()">Buy (10)</button>
</div>

<div class="card">
<h3>🏭 Factory</h3>
<button class="action" onclick="buyFactory()">Buy (20)</button>
</div>

</div>

<!-- REF -->
<div id="ref" class="page">

<div class="card">
<h3>👥 Referral Code</h3>
<p id="mycode"></p>
<button onclick="copyCode()">Copy</button>
<button onclick="useRef()">Enter code</button>
</div>

</div>

<!-- LEADERBOARD -->
<div id="lb" class="page">

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>

</div>

<!-- DAILY -->
<div id="daily" class="page">

<div class="card">
<h3>🎁 Daily Bonus</h3>
<button onclick="claimDaily()">Claim</button>
<p id="dailyText"></p>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="openPage('home')">Home</button>
<button onclick="openPage('shop')">Shop</button>
<button onclick="openPage('ref')">Ref</button>
<button onclick="openPage('lb')">Rank</button>
<button onclick="openPage('daily')">Daily</button>
</div>

<script>

// ===== DATA =====
let coins = +localStorage.getItem("coins") || 0;
let power = +localStorage.getItem("power") || 1;
let factories = +localStorage.getItem("factories") || 0;
let level = +localStorage.getItem("level") || 1;

// ===== REF =====
let mycode = localStorage.getItem("mycode");
if(!mycode){
    mycode = "LIME-" + Math.floor(Math.random()*99999);
    localStorage.setItem("mycode", mycode);
}

// ===== DAILY =====
let lastDaily = +localStorage.getItem("daily") || 0;

// ===== SAVE =====
function save(){
localStorage.setItem("coins", coins);
localStorage.setItem("power", power);
localStorage.setItem("factories", factories);
localStorage.setItem("level", level);
}

// ===== UPDATE =====
function update(){
document.getElementById("balance").innerText = coins;
document.getElementById("level").innerText = "Level: " + level;
document.getElementById("mycode").innerText = mycode;
}

// ===== CLICK =====
function clickLime(){
coins += power;
save(); update();
checkLevel();
}

// ===== SHOP =====
function buyPower(){
if(coins>=10){
coins-=10; power++;
save(); update();
}
}

function buyFactory(){
if(coins>=20){
coins-=20; factories++;
save(); update();
}
}

// ===== LEVEL =====
function checkLevel(){
level = Math.floor(Math.pow(coins/100,0.6))+1;
}

// ===== REF =====
function copyCode(){
navigator.clipboard.writeText(mycode);
alert("Copied!");
}

function useRef(){
let c = prompt("Enter code:");
if(!c || c==mycode) return;
coins += 500;
power += 1;
save(); update();
alert("+500 bonus!");
}

// ===== DAILY BONUS =====
function claimDaily(){
let now = Date.now();
if(now - lastDaily < 86400000){
document.getElementById("dailyText").innerText = "Already claimed today";
return;
}
coins += 1000;
lastDaily = now;
localStorage.setItem("daily", lastDaily);
save(); update();
alert("Daily +1000!");
}

// ===== LEADERBOARD (LOCAL SIM) =====
function loadBoard(){
let fake = [
{n:"Player1",c:1200},
{n:"Player2",c:900},
{n:"You",c:coins}
];
fake.sort((a,b)=>b.c-a.c);

document.getElementById("board").innerHTML =
fake.map(p=>`<p>${p.n} - ${p.c}</p>`).join("");
}

// ===== NAV =====
function openPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
if(p=="lb") loadBoard();
}

// ===== LOOP =====
setInterval(()=>{
coins += factories;
save();
update();
checkLevel();
},1000);

// START
update();

</script>

</body>
</html>
