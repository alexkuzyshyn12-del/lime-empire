<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(180deg,#fff7cc,#ffe680);
    margin:0;
}

h1{margin:10px;}
#coins{font-size:40px;font-weight:bold;}

.card{
    background:white;
    width:300px;
    margin:10px auto;
    padding:10px;
    border-radius:12px;
}

button{
    width:90%;
    padding:10px;
    margin:5px;
    border:none;
    background:#ffcc00;
    font-weight:bold;
    border-radius:8px;
}

.page{display:none;}
.active{display:block;}

.nav{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
}
.nav button{flex:1;}
</style>
</head>

<body>

<h1>🍋 Lime Empire</h1>

<div class="card">
<div id="coins">0</div>
<div>⚡ Energy: <span id="energy">100</span></div>
</div>

<!-- HOME -->
<div id="home" class="page active">
<button onclick="tap()">🍋 TAP</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<button onclick="upgradeTap()">Upgrade Tap</button>
<button onclick="buyFactory()">Buy Factory</button>
</div>

<!-- REF -->
<div id="ref" class="page">
<p id="refcode"></p>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="openPage('home')">Home</button>
<button onclick="openPage('shop')">Shop</button>
<button onclick="openPage('ref')">Ref</button>
</div>

<!-- =============================== -->
<!-- 🔥 FIREBASE CONFIG PLACE BELOW -->
<!-- =============================== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script>

/* ======================================================
   🔥 ВСТАВ СЮДИ FIREBASE CONFIG (ТОВІ ДАНІ З CONSOLE)
====================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDHs8hHW4y-QCGx1ncYy-SOwPTfmuHtjB8",
  authDomain: "limeempire-ca8d4.firebaseapp.com",
  projectId: "limeempire-ca8d4",
  storageBucket: "limeempire-ca8d4.firebasestorage.app",
  messagingSenderId: "86132052870",
  appId: "1:86132052870:web:e94cee824f08a191c81207",
  measurementId: "G-KERY2X6D68"
};

/* ======================================================
   НЕ ТРОГАЙ НИЖЧЕ (поки не вставиш config)
====================================================== */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== USER =====
let userId = localStorage.getItem("uid");
if(!userId){
    userId = "U"+Math.floor(Math.random()*999999);
    localStorage.setItem("uid",userId);
}

// ===== DATA =====
let coins = 0;
let power = 1;
let factories = 0;
let energy = 100;

// ===== TAP =====
function tap(){
if(energy<=0) return;
coins += power;
energy--;
save();
update();
}

// ===== UPGRADE TAP =====
function upgradeTap(){
if(coins >= 50*power){
    coins -= 50*power;
    power++;
    save();
    update();
}
}

// ===== BUY FACTORY =====
function buyFactory(){
if(coins >= 10000){
    coins -= 10000;
    factories++;
    save();
    update();
}
}

// ===== ENERGY =====
setInterval(()=>{
if(energy<100) energy++;
update();
},1000);

// ===== INCOME =====
setInterval(()=>{
coins += factories * 50;
save();
update();
},1000);

// ===== SAVE ONLINE =====
function save(){
db.collection("players").doc(userId).set({
    coins: coins,
    power: power,
    factories: factories
});
}

// ===== LOAD ONLINE =====
async function load(){
let doc = await db.collection("players").doc(userId).get();

if(doc.exists){
    let d = doc.data();
    coins = d.coins;
    power = d.power;
    factories = d.factories;
}
update();
}

// ===== UI =====
function update(){
document.getElementById("coins").innerText = coins;
document.getElementById("energy").innerText = energy;
document.getElementById("refcode").innerText =
"https://t.me/YOUR_BOT?start="+userId;
}

// ===== NAV =====
function openPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

// START
load();
update();

</script>

</body>
</html>
