<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire Menu</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #fff7cc, #ffe680);
    text-align: center;
}

/* TOP */
h1 {
    margin: 10px;
}

/* BALANCE */
#balance {
    font-size: 35px;
    font-weight: bold;
}

/* LIME */
#lime {
    width: 180px;
    cursor: pointer;
    transition: 0.1s;
}

#lime:active {
    transform: scale(0.9);
}

/* SECTIONS */
.page {
    display: none;
    padding: 10px;
}

.active {
    display: block;
}

/* BOTTOM MENU */
.nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: #fff;
    border-top: 2px solid #ddd;
}

.nav button {
    flex: 1;
    padding: 15px;
    border: none;
    background: white;
    font-weight: bold;
    cursor: pointer;
}

.nav button:hover {
    background: #f5f5f5;
}

/* CARD */
.card {
    background: white;
    width: 280px;
    margin: 10px auto;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

button.action {
    width: 100%;
    padding: 10px;
    border: none;
    background: #ffcc00;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🍋 Lime Empire</h1>
<div id="balance">0</div>

<!-- HOME -->
<div id="home" class="page active">
    <img id="lime"
    src="https://upload.wikimedia.org/wikipedia/commons/1/1f/Lime-Whole-Split.jpg"
    onclick="clickLime()">
</div>

<!-- SHOP -->
<div id="shop" class="page">

    <div class="card">
        <h3>⚡ Power</h3>
        <button class="action" onclick="buyPower()">Buy (10)</button>
    </div>

    <div class="card">
        <h3>🏭 Factory</h3>
        <button class="action" onclick="buyFactory()">Buy (20)</button>
    </div>

</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="page">
    <h2>🏆 Leaderboard</h2>
    <p>Coming soon...</p>
</div>

<!-- REFERRAL -->
<div id="ref" class="page">
    <h2>👥 Referral System</h2>
    <p>Invite friends and earn rewards!</p>
</div>

<!-- NAV -->
<div class="nav">
    <button onclick="openPage('home')">Home</button>
    <button onclick="openPage('shop')">Shop</button>
    <button onclick="openPage('leaderboard')">Rank</button>
    <button onclick="openPage('ref')">Ref</button>
</div>

<script>

// DATA
let coins = Number(localStorage.getItem("coins")) || 0;
let power = Number(localStorage.getItem("power")) || 1;
let factories = Number(localStorage.getItem("factories")) || 0;

// UPDATE
function update() {
    document.getElementById("balance").innerText = coins;
}

// SAVE
function save() {
    localStorage.setItem("coins", coins);
    localStorage.setItem("power", power);
    localStorage.setItem("factories", factories);
}

// CLICK
function clickLime() {
    coins += power;
    save();
    update();
}

// SHOP
function buyPower() {
    if (coins >= 10) {
        coins -= 10;
        power++;
        save();
        update();
    }
}

function buyFactory() {
    if (coins >= 20) {
        coins -= 20;
        factories++;
        save();
        update();
    }
}

// NAVIGATION
function openPage(page) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
}

// START
update();

</script>

</body>
</html>
