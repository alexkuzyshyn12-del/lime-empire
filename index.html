<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire PRO MAX</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(180deg, #fff7cc, #ffe680);
}

h1 { margin: 10px; }

#balance {
    font-size: 40px;
    font-weight: bold;
}

#level {
    font-size: 18px;
}

.center {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

#lime {
    width: 180px;
    cursor: pointer;
    transition: 0.1s;
}

#lime:active {
    transform: scale(0.9);
}

.shop {
    margin-top: 20px;
}

.card {
    background: white;
    width: 280px;
    margin: 10px auto;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #ffcc00;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🍋 Lime Empire PRO MAX</h1>

<div id="balance">0</div>
<div id="level">Level: 1</div>

<div class="center">
    <img id="lime"
    src="https://upload.wikimedia.org/wikipedia/commons/1/1f/Lime-Whole-Split.jpg"
    onclick="clickLime()">
</div>

<div class="shop">

    <div class="card">
        <h3>⚡ Power</h3>
        <button onclick="buyPower()">Buy (10)</button>
    </div>

    <div class="card">
        <h3>🏭 Lemon Factory</h3>
        <button onclick="buyFactory('lemon')">Buy (20)</button>
    </div>

    <div class="card">
        <h3>🏭 Juice Factory</h3>
        <button onclick="buyFactory('juice')">Buy (100)</button>
    </div>

    <div class="card">
        <h3>🏭 Mega Factory</h3>
        <button onclick="buyFactory('mega')">Buy (400)</button>
    </div>

    <div class="card">
        <h3>💰 Offline Reward</h3>
        <button onclick="claimReward()">Claim</button>
    </div>

</div>

<script>

// ===== DATA =====
let coins = Number(localStorage.getItem("coins")) || 0;
let power = Number(localStorage.getItem("power")) || 1;

let factories = {
    lemon: Number(localStorage.getItem("lemon")) || 0,
    juice: Number(localStorage.getItem("juice")) || 0,
    mega: Number(localStorage.getItem("mega")) || 0
};

let level = Number(localStorage.getItem("level")) || 1;

let lastTime = Number(localStorage.getItem("lastTime")) || Date.now();
let pendingReward = Number(localStorage.getItem("pendingReward")) || 0;

// ===== SAVE =====
function save() {
    localStorage.setItem("coins", coins);
    localStorage.setItem("power", power);
    localStorage.setItem("lemon", factories.lemon);
    localStorage.setItem("juice", factories.juice);
    localStorage.setItem("mega", factories.mega);
    localStorage.setItem("level", level);
    localStorage.setItem("lastTime", lastTime);
    localStorage.setItem("pendingReward", pendingReward);
}

// ===== UPDATE =====
function update() {
    document.getElementById("balance").innerText = coins;
    document.getElementById("level").innerText = "Level: " + level;
}

// ===== CLICK =====
function clickLime() {
    coins += power;
    save();
    update();
    checkLevel();
}

// ===== POWER =====
function buyPower() {
    if (coins >= 10) {
        coins -= 10;
        power += 1;
        save();
        update();
    }
}

// ===== FACTORIES =====
function buyFactory(type) {
    if (type === "lemon" && coins >= 20) {
        coins -= 20;
        factories.lemon++;
    }

    if (type === "juice" && coins >= 100) {
        coins -= 100;
        factories.juice++;
    }

    if (type === "mega" && coins >= 400) {
        coins -= 400;
        factories.mega++;
    }

    save();
    update();
}

// ===== PASSIVE INCOME =====
setInterval(() => {
    coins += factories.lemon * 1;
    coins += factories.juice * 5;
    coins += factories.mega * 20;

    save();
    update();
    checkLevel();
}, 1000);

// ===== LEVEL (HARD PROGRESSION) =====
function checkLevel() {
    level = Math.floor(Math.pow(coins / 100, 0.6)) + 1;
}

// ===== OFFLINE REWARD =====
function calcOffline() {
    let now = Date.now();
    let diff = now - lastTime;

    let max = 3 * 60 * 60 * 1000;
    if (diff >= max) {
        pendingReward =
            factories.lemon * 3600 * 1 +
            factories.juice * 3600 * 5 +
            factories.mega * 3600 * 20;

        pendingReward = Math.floor(pendingReward);
    } else {
        pendingReward = 0;
    }
}

function claimReward() {
    calcOffline();

    if (pendingReward > 0) {
        coins += pendingReward;
        pendingReward = 0;
        lastTime = Date.now();
        save();
        update();
        alert("💰 Claimed reward!");
    } else {
        alert("❌ Nothing to claim or expired");
    }
}

// ===== START =====
calcOffline();
update();

</script>

</body>
</html>
