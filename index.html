<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire</title>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#fff7cc;
}

.card{
  width:320px;
  margin:10px auto;
  background:white;
  padding:10px;
  border-radius:10px;
}

button{
  width:90%;
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h1>🍋 Lime Empire</h1>

<div class="card">
<h2>💰 Coins: <span id="coins">0</span></h2>
<h3>⚡ Energy: <span id="energy">100</span></h3>
<h3>🖱 Power: <span id="power">1</span></h3>
</div>

<button onclick="tap()">🍋 TAP</button>
<button onclick="upgrade()">Upgrade Tap</button>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board">Loading...</div>
</div>

<!-- ============================= -->
<!-- 🔥 1. SERVER (FIREBASE) AREA -->
<!-- ============================= -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script>

/* ======================================================
   🔥 ВСТАВ СЮДИ КОД СЕРВЕРА (Firebase config)
   ⬇️⬇️⬇️⬇️⬇️⬇️⬇️⬇️⬇️⬇️⬇️⬇️⬇️
====================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDHs8hHW4y-QCGx1ncYy-SOwPTfmuHtjB8",
  authDomain: "limeempire-ca8d4.firebaseapp.com",
  projectId: "limeempire-ca8d4",
  storageBucket: "limeempire-ca8d4.firebasestorage.app",
  messagingSenderId: "86132052870",
  appId: "1:86132052870:web:e94cee824f08a191c81207",
  measurementId: "G-KERY2X6D68"
};

/* ======================================================
   🔥 ПІСЛЯ ЦЬОГО КОДУ НІЧОГО НЕ МІНЯТИ
====================================================== */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   👤 USER ID
========================= */

let user = localStorage.getItem("uid");
if(!user){
  user = "U"+Math.floor(Math.random()*999999);
  localStorage.setItem("uid",user);
}

/* =========================
   🎮 GAME DATA
========================= */

let coins = 0;
let power = 1;
let energy = 100;

/* =========================
   🍋 TAP
========================= */

function tap(){
  coins += power;
  energy--;
  save();
  update();
}

/* =========================
   ⚙️ UPGRADE
========================= */

function upgrade(){
  let cost = 50 * power;

  if(coins >= cost){
    coins -= cost;
    power++;
    save();
    update();
  }
}

/* =========================
   💾 SAVE TO SERVER
========================= */

function save(){
  db.collection("players").doc(user).set({
    coins,
    power,
    energy
  });
}

/* =========================
   📥 LOAD FROM SERVER
========================= */

async function load(){
  let doc = await db.collection("players").doc(user).get();

  if(doc.exists){
    let d = doc.data();
    coins = d.coins || 0;
    power = d.power || 1;
    energy = d.energy || 100;
  }

  update();
}

/* =========================
   🏆 LEADERBOARD (ONLINE)
========================= */

async function leaderboard(){
  let snap = await db.collection("players")
  .orderBy("coins","desc")
  .limit(10)
  .get();

  let html = "";
  let i = 1;

  snap.forEach(doc=>{
    html += `<p>${i}. ${doc.id} — ${doc.data().coins}</p>`;
    i++;
  });

  document.getElementById("board").innerHTML = html;
}

/* =========================
   🔁 AUTO SAVE + LB
========================= */

setInterval(()=>{
  save();
  leaderboard();
},5000);

/* =========================
   📊 UPDATE UI
========================= */

function update(){
  document.getElementById("coins").innerText = coins;
  document.getElementById("energy").innerText = energy;
  document.getElementById("power").innerText = power;
}

/* =========================
   🚀 START
========================= */

load();
leaderboard();
update();

</script>

</body>
</html>
