<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lime Empire Full</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:linear-gradient(180deg,#fff7cc,#ffe680);
    margin:0;
}

h1{margin:10px;}

#coins{font-size:40px;font-weight:bold;}
#energy{color:green;}

.card{
    background:white;
    width:300px;
    margin:10px auto;
    padding:10px;
    border-radius:12px;
}

button{
    width:90%;
    padding:10px;
    margin:5px;
    border:none;
    background:#ffcc00;
    font-weight:bold;
    border-radius:8px;
}

.nav{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
}

.nav button{flex:1;}
.page{display:none;}
.active{display:block;}
</style>
</head>

<body>

<h1>🍋 Lime Empire</h1>

<div class="card">
<div id="coins">0</div>
<div>⚡ Energy: <span id="energy">100</span></div>
<div>🖱 Tap Power: <span id="power">1</span></div>
</div>

<!-- HOME -->
<div id="home" class="page active">
<button onclick="tap()">🍋 TAP</button>
</div>

<!-- SHOP -->
<div id="shop" class="page">

<div class="card">
<h3>🖱 Upgrade Tap</h3>
<button onclick="upgradeTap()">Upgrade</button>
</div>

<div class="card">
<h3>🏭 Rubber Factory</h3>
<button onclick="buy('rubber')">Buy</button>
<p>Lvl: <span id="r1"></span></p>
</div>

<div class="card">
<h3>🍹 Juice Factory</h3>
<button onclick="buy('juice')">Buy</button>
<p>Lvl: <span id="r2"></span></p>
</div>

</div>

<!-- REF -->
<div id="ref" class="page">
<div class="card">
<h3>👥 Referral</h3>
<p id="refcode"></p>
</div>
</div>

<!-- LB -->
<div id="lb" class="page">
<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="openPage('home')">Home</button>
<button onclick="openPage('shop')">Shop</button>
<button onclick="openPage('ref')">Ref</button>
<button onclick="openPage('lb')">Rank</button>
</div>

<script>

// ===== DATA =====
let coins = 0;
let power = 1;
let energy = 100;

// factories
let f = {
    rubber:{c:0,lvl:1,base:60},
    juice:{c:0,lvl:1,base:200}
};

// user
let user = localStorage.getItem("uid");
if(!user){
    user = "U"+Math.floor(Math.random()*999999);
    localStorage.setItem("uid",user);
}

// ===== TAP =====
function tap(){
if(energy<=0) return;

coins += power;
energy -= 1;

save();
update();
}

// ===== TAP UPGRADE =====
function upgradeTap(){
if(coins >= 50*power){
    coins -= 50*power;
    power++;
    save();
    update();
}
}

// ===== BUY FACTORY =====
function buy(t){
let cost = 10000 * f[t].lvl;

if(coins >= cost){
    coins -= cost;
    f[t].lvl++;
    save();
    update();
}
}

// ===== ENERGY =====
setInterval(()=>{
if(energy < 100) energy++;
update();
},1000);

// ===== INCOME =====
setInterval(()=>{
coins += f.rubber.c * f.rubber.base * f.rubber.lvl;
coins += f.juice.c * f.juice.base * f.juice.lvl;
save();
update();
},1000);

// ===== SAVE (LOCAL) =====
function save(){
localStorage.setItem("game",JSON.stringify({
coins,power,energy,f
}));
}

// ===== LOAD =====
function load(){
let g = JSON.parse(localStorage.getItem("game"));
if(g){
coins=g.coins;
power=g.power;
energy=g.energy;
f=g.f;
}
update();
}

// ===== REF =====
function ref(){
document.getElementById("refcode").innerText =
"https://t.me/YOUR_BOT?start="+user;
}

// ===== LB =====
function board(){
document.getElementById("board").innerHTML=
"<p>Online leaderboard needs Firebase</p>";
}

// ===== UI =====
function update(){
document.getElementById("coins").innerText = coins;
document.getElementById("energy").innerText = energy;
document.getElementById("power").innerText = power;

document.getElementById("r1").innerText = f.rubber.lvl;
document.getElementById("r2").innerText = f.juice.lvl;

ref();
}

// ===== NAV =====
function openPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");

if(p=="lb") board();
}

// START
load();
update();

</script>

</body>
</html>
