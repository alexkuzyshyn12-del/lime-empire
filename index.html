<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lime Empire</title>
<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial;
}

#coin {
    font-size: 120px;
    cursor: pointer;
    margin-top: 100px;
}

#score {
    font-size: 30px;
}
</style>
</head>

<body>

<h1>🍋 Lime Empire</h1>

<div id="score">0</div>

<div id="coin" onclick="tap()">🍋</div>

<script>

let score = 0;

function tap(){
    score++;
    document.getElementById("score").innerText = score;
}

</script>

</body>
</html>
